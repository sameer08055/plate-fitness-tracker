# Runs on every push and pull request: unit tests + Terraform checks.
# It doesn't deploy: this AWS account type blocks the OpenID Connect setup
# GitHub would need, and storing long-lived AWS keys in GitHub is risky.
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run unit tests
        working-directory: backend
        run: pytest -v

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Validate configuration
        run: |
          terraform init -backend=false
          terraform validate
